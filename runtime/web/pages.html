<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<title>Dead Cells</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #canvas { display: block; position: fixed; inset: 0; margin: auto; width: min(100vw, calc(100vh * 16 / 9)) !important; height: min(100vh, calc(100vw * 9 / 16)) !important; }
  #error, #log { position: fixed; left: 0; margin: 0; padding: 8px; max-width: 100%; box-sizing: border-box; font: 13px monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: #ddd; background: #000c; }
  #error { top: 0; color: #ffaca8; }
  #log { bottom: 0; max-height: 35vh; overflow: auto; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()" aria-label="Dead Cells game"></canvas>
<pre id="error" role="alert" hidden></pre>
<pre id="log" hidden></pre>
<script src="launcher.js?v=mouse-capture-1"></script>
</body>
</html>
